name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: pytest - COBOL PIC truncation probe
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol
          cobc --version

      - name: Run probe smoke-test (47 312 records)
        run: |
          python probe.py --records 47312 | tee smoke.txt
          grep -F "Records processed       : 47,312" smoke.txt
          grep -F "Buggy   payroll total   : \$45,294,763.33" smoke.txt
          grep -F "Exact   payroll total   : \$45,335,595.73790" smoke.txt
          python probe.py --attribute | grep -F "Total loss               : \$40,832.40790"

      - name: Run pytest suite (no skips allowed)
        run: |
          python -m pytest tests/ -v -rs --tb=short | tee pytest.txt
          if grep -qi "skipped" pytest.txt; then echo "tests were skipped"; exit 1; fi
